  <line x1="0" y1="50" x2="100" y2="50" stroke="#9E7658" stroke-width="1.5" />
  <line x1="0" y1="75" x2="100" y2="75" stroke="#9E7658" stroke-width="1.5" />
  <!-- Hair back -->
  <path d="M30 40 C30 18 70 18 70 40 Z" fill="#2C221E" />
  <!-- Ears -->
  <circle cx="31" cy="46" r="4.5" fill="#E2A783" />
  <circle cx="69" cy="46" r="4.5" fill="#E2A783" />
  <!-- Neck -->
  <rect x="42" y="58" width="16" height="18" fill="#D39572" />
  <!-- Face -->
  <path d="M33 38 C33 28 67 28 67 38 L67 50 C67 60 59 66 50 66 C41 66 33 60 33 50 Z" fill="#F0B892" />
