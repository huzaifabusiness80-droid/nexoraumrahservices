  <path d="M37 40 Q42 38 46 40" stroke="#2C221E" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M54 40 Q58 38 63 40" stroke="#2C221E" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Eyes with happy curve -->
  <circle cx="42" cy="45" r="2.5" fill="#2C221E" />
  <circle cx="58" cy="45" r="2.5" fill="#2C221E" />
  <!-- Nose -->
  <path d="M50 46 L50 51 L52 51" stroke="#C88863" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <!-- Big smiling mouth -->
  <path d="M42 56 Q50 65 58 56 Z" fill="#FFFFFF" stroke="#874B2A" stroke-width="1.2" />
  <!-- White T-shirt with necklace/strap -->
  <path d="M20 82 C24 70 38 68 44 72 L50 78 L56 72 C62 68 76 70 80 82 L80 100 L20 100 Z" fill="#F8F9FA" />
